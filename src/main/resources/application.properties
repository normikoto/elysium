# Defaults built into the JAR. Don't copy these into your own config: see application.properties.example instead.
spring.application.name=elysium
spring.threads.virtual.enabled=true

# compose.yaml is the production stack, so running from a checkout must not start or stop it. The dev profile turns this on.
spring.docker.compose.enabled=false

# Where the public API documentation is served. These stay outside /api, which is reserved for the client API.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/api-docs/ui
# Endpoints that don't say what they produce write JSON, rather than whatever the client asks for.
springdoc.default-produces-media-type=application/json
# Swagger UI signs in with the authorization code flow. Its PKCE challenges use S256, the only method the server accepts.
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# Events only stay stored until their listeners have finished. EventRetries tries again for any that don't.
spring.modulith.events.completion-mode=DELETE

# Jobs. The worker waits for the context, so that it can't run a job before everything the job needs is ready.
db-scheduler.delay-startup-until-context-ready=true
# As many jobs as the federation HTTP client has connections, so that a few slow servers can't hold up all the others.
db-scheduler.threads=64
# Often enough that waiting jobs can keep a busy server's slots in use. HostGate spaces them out to suit this.
db-scheduler.polling-interval=PT1S
# Under the path that SecurityConfig limits to admins.
db-scheduler-ui.context-path=admin
# History is the only place that says why a job failed. JobCleanupTask removes old rows.
db-scheduler-ui.history=true
db-scheduler-ui.log.enabled=true
# Admin pages and the job UI's API aren't part of the public API.
springdoc.paths-to-exclude=/admin/**
# Mastodon's API names repeated parameters like id[], and many clients send the brackets without encoding them, which Tomcat
# refuses with a 400 by default.
server.tomcat.relaxed-query-chars=[,]

# Spring's limits on uploads follow elysium.profiles.max-image-size and the elysium.attachments limits. See
# api.web.MultipartConfig.
# Media is served as the type its extension has in the servlet container's table, which has older names for these than
# the ones clients and other servers are told.
server.mime-mappings.flac=audio/flac
server.mime-mappings.wav=audio/wav

# JavaMail waits forever by default, and sign-ups send their email while the person waits for the page, so a stalled SMTP
# server would hold their request open indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
