# Copy this file to where SPRING_CONFIG_LOCATION is set to.
spring.application.name=elysium
spring.threads.virtual.enabled=true

# Where the public API documentation is served. These stay outside /api, which is reserved for the client API.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/api-docs/ui

# Required: the public URL of this server, with no path. Federating with other servers requires a public HTTPS URL.
# Don't change it after federating: actor URIs and the instance domain are derived from it.
#elysium.instance.base-url=https://example.com

# Creates this local actor on startup if it doesn't exist yet.
#elysium.bootstrap.admin-username=admin

# Sets the admin's password if it doesn't have one. It never replaces an existing password. Must be 8 to 128 characters.
# Prefer setting this through the ELYSIUM_BOOTSTRAP_ADMIN_PASSWORD environment variable.
#elysium.bootstrap.admin-password=

# Lets anyone create an account at /signup. There's no email confirmation or rate limiting.
#elysium.registration.enabled=false

# Uncomment if a reverse proxy handles HTTPS and is the only way to reach this server, so that redirects use the public
# URL. The server trusts the forwarded headers it receives.
#server.forward-headers-strategy=native
