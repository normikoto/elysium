# Local development only. ./gradlew bootRun activates this profile.
elysium.instance.base-url=http://localhost:8080
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.dev.yaml
# Mailpit, from compose.dev.yaml. Try sign-ups with --args='--elysium.registration.mode=open'.
spring.mail.host=localhost
spring.mail.port=1025
elysium.mail.from=elysium@localhost
