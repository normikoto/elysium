<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Directory', ~{::content})}">
<th:block th:fragment="content">
    <div class="wide">
        <nav class="tabs" aria-label="Order">
            <a th:href="@{/directory}" th:attr="aria-current=${order == 'active'} ? 'page'">Recently active</a>
            <a th:href="@{/directory(order='new')}" th:attr="aria-current=${order == 'new'} ? 'page'">New</a>
        </nav>
        <div class="posts">
            <p class="posts-empty" th:if="${#lists.isEmpty(entries)}">No one is listed yet.</p>
            <article class="post" th:each="entry : ${entries}">
                <img class="post-avatar" th:if="${entry.author().avatar() != null}" th:src="${entry.author().avatar()}"
                     alt="" loading="lazy">
                <div class="post-avatar" th:if="${entry.author().avatar() == null}" aria-hidden="true"
                     th:text="${entry.author().initial()}"></div>
                <div>
                    <p class="post-head">
                        <a class="post-name" th:href="@{/users/{username}(username=${entry.username()})}"
                           th:text="${entry.author().displayName()}"></a>
                        <span class="post-handle" th:text="|@${entry.username()}|"></span>
                    </p>
                    <!--/* Bios are rendered from plain text, which escapes everything they contain. */-->
                    <div class="post-content" th:if="${!#strings.isEmpty(entry.bio())}" th:utext="${entry.bio()}"></div>
                </div>
            </article>
            <p class="posts-more" th:if="${nextPage != null}">
                <a th:href="${order == 'new'} ? @{/directory(order='new',page=${nextPage})} : @{/directory(page=${nextPage})}">More</a>
            </p>
        </div>
        <p class="site-footer"><a href="/">Back to the front page</a></p>
    </div>
</th:block>
</html>
