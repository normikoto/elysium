<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(|@${actor.username}|, ~{::content})}">
<th:block th:fragment="content">
    <div class="wide">
        <p th:text="|@${actor.username}@${actor.domain}|"></p>
        <p>Joined <span th:text="${joined}"></span> · Posts: <span th:text="${statusCount}"></span></p>
        <p th:if="${#lists.isEmpty(statuses)}">No posts to show.</p>
        <th:block th:each="view : ${statuses}" th:insert="~{status-card :: card(${view})}"></th:block>
        <p th:if="${olderThan != null}">
            <a th:href="@{/users/{username}(username=${actor.username},max_id=${olderThan})}">Older posts</a>
        </p>
        <p><a href="/">Back to the front page</a></p>
    </div>
</th:block>
</html>
