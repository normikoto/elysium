<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Change your password', ~{::content})}">
<th:block th:fragment="content">
    <p class="notice" role="status" th:if="${changed}">
        Your password is changed. Other browsers are logged out, and your apps have to be authorized again.
    </p>
    <p th:unless="${changed}">
        Changing your password logs you out of every other browser, and your apps have to be authorized again.
    </p>
    <p class="notice" role="alert" th:if="${error != null}" th:text="${error}"></p>
    <form method="post" th:action="@{/settings/password}">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required
               autofocus>
        <label for="newPassword" th:text="|New password (${minLength} to ${maxLength} characters)|">New password</label>
        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required
               th:minlength="${minLength}" th:maxlength="${maxLength}">
        <label for="confirmation">New password again</label>
        <input type="password" id="confirmation" name="confirmation" autocomplete="new-password" required
               th:minlength="${minLength}" th:maxlength="${maxLength}">
        <button type="submit">Change password</button>
    </form>
    <p><a href="/settings">Back to settings</a></p>
</th:block>
</html>
