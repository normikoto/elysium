<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Confirm your email address', ~{::content})}">
<th:block th:fragment="content">
    <p>Confirm your email address for the account <strong th:text="'@' + ${username}"></strong>.</p>
    <p th:if="${approvalRequired}">After that, an admin has to approve your account before you can log in.</p>
    <form method="post" action="/signup/verify">
        <input type="hidden" th:name="${csrfParameter}" th:value="${csrfToken}">
        <input type="hidden" name="token" th:value="${token}">
        <button type="submit">Confirm</button>
    </form>
</th:block>
</html>
