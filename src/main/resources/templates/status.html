<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(|Post by ${view.authorName}|, ~{::content})}">
<th:block th:fragment="content">
    <div class="wide">
        <p th:if="${parent != null}">
            In reply to <a th:href="@{${parent.url}}" th:text="${parent.authorName}"></a>
        </p>
        <th:block th:insert="~{status-card :: card(${view})}"></th:block>
        <p><a th:href="@{${view.authorUrl}}" th:text="|More from ${view.authorName}|"></a></p>
    </div>
</th:block>
</html>
