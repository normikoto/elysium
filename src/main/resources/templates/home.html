<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${domain}, ~{::content})}">
<th:block th:fragment="content">
    <div class="wide">
        <p class="muted">
            <span th:text="${#numbers.formatInteger(userCount, 1, 'COMMA')}"></span> users ·
            <span th:text="${#numbers.formatInteger(statusCount, 1, 'COMMA')}"></span> posts
        </p>
        <p>
            <a class="button" href="/signup" th:if="${registrationEnabled}">Create an account</a>
            <a class="button button-quiet" href="/admin" th:if="${showAdmin}">Admin</a>
        </p>
        <section class="posts" aria-labelledby="recent-heading">
            <h2 class="posts-heading" id="recent-heading">Recent posts</h2>
            <p class="posts-empty" th:if="${#lists.isEmpty(statuses)}">No posts yet.</p>
            <th:block th:each="view : ${statuses}" th:insert="~{status-card :: card(${view})}"></th:block>
        </section>
    </div>
</th:block>
</html>
