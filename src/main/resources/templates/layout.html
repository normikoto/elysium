<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} - Elysium|"></title>
    <link rel="stylesheet" th:href="@{/css/elysium.css}">
</head>
<body>
<header class="topbar" th:fragment="topbar">
    <nav aria-label="Site">
        <a class="brand" href="/">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3v18"/><path d="M5 8c3 0 7 1 7 5"/><path d="M19 8c-3 0-7 1-7 5"/>
                <path d="M7 3.5c2 1 5 2 5 5"/><path d="M17 3.5c-2 1-5 2-5 5"/>
            </svg>
            <span th:text="${siteDomain} ?: 'Elysium'">Elysium</span>
        </a>
        <div class="topbar-links">
            <a class="button button-quiet" href="/settings" th:if="${signedIn}">Settings</a>
            <a class="button button-quiet" href="/login" th:unless="${signedIn}">Log in</a>
        </div>
    </nav>
</header>
<main class="page">
    <h1 th:text="${title}"></h1>
    <th:block th:replace="${content}"></th:block>
</main>
</body>
</html>
