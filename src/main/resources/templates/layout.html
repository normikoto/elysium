<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} - Elysium|"></title>
    <style>
        :root { color-scheme: light dark; }
        body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 0 auto; max-width: 26rem; padding: 2rem 1rem; }
        h1 { font-size: 1.5rem; }
        label { display: block; margin-top: 1rem; }
        input[type=text], input[type=password] { box-sizing: border-box; font: inherit; padding: 0.5rem; width: 100%; }
        button { font: inherit; margin-top: 1rem; padding: 0.5rem 1rem; }
        code { display: block; overflow-wrap: anywhere; padding: 0.5rem 0; user-select: all; }
        form.actions { display: inline-block; margin-right: 0.5rem; }
        .notice { font-weight: 600; }
        body:has(.wide) { max-width: 40rem; }
        h2 { font-size: 1.25rem; }
        .status { border-top: 1px solid color-mix(in srgb, currentColor 25%, transparent); padding: 0.75rem 0; }
        .status-meta { display: flex; flex-wrap: wrap; font-size: 0.9rem; gap: 0.25rem 1rem; justify-content: space-between; margin: 0 0 0.5rem; }
        .status-content { overflow-wrap: anywhere; }
        .status-content p { margin: 0.5rem 0; }
        summary { cursor: pointer; overflow-wrap: anywhere; }
        textarea { box-sizing: border-box; font: inherit; padding: 0.5rem; width: 100%; }
        fieldset { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); margin-top: 1rem; }
        .error { color: #c00; font-weight: 600; }
        .profile-header { aspect-ratio: 3 / 1; display: block; object-fit: cover; width: 100%; }
        .avatar { border-radius: 0.5rem; height: 6rem; margin-top: 1rem; width: 6rem; }
        .bio { overflow-wrap: anywhere; }
        .fields { display: grid; gap: 0.25rem 1rem; grid-template-columns: minmax(6rem, auto) 1fr; overflow-wrap: anywhere; }
        .fields dt { font-weight: 600; }
        .fields dd { margin: 0; }
        .fields .verified { color: #080; }
    </style>
</head>
<body>
<h1 th:text="${title}"></h1>
<th:block th:replace="${content}"></th:block>
</body>
</html>
