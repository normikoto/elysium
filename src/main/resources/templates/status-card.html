<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<article class="status" th:fragment="card(view)" th:lang="${view.status.language} ?: 'und'">
    <p class="status-boost" th:if="${view.boostedBy}">
        <a th:href="@{/users/{username}(username=${view.boostedBy})}" th:text="|@${view.boostedBy}|"></a> boosted
    </p>
    <p class="status-meta">
        <a th:href="@{${view.authorUrl}}" th:text="${view.authorName}"></a>
        <a th:href="@{${view.url}}"><time th:datetime="${view.status.publishedAt}" th:text="${view.publishedAt}"></time></a>
    </p>
    <details th:if="${view.status.sensitive}">
        <summary th:text="${#strings.isEmpty(view.status.spoilerText)} ? 'Sensitive content' : ${view.status.spoilerText}"></summary>
        <div class="status-content" th:utext="${view.status.content}"></div>
        <div th:replace="~{status-card :: attachments(${view.attachments})}"></div>
        <div th:replace="~{status-card :: poll(${view.poll})}"></div>
    </details>
    <th:block th:unless="${view.status.sensitive}">
        <div class="status-content" th:utext="${view.status.content}"></div>
        <div th:replace="~{status-card :: attachments(${view.attachments})}"></div>
        <div th:replace="~{status-card :: poll(${view.poll})}"></div>
    </th:block>
</article>
<div class="status-attachments" th:fragment="attachments(attachments)" th:unless="${#lists.isEmpty(attachments)}">
    <th:block th:each="attachment : ${attachments}">
        <a th:if="${attachment.kind == 'image'}" th:href="${attachment.href}">
            <img loading="lazy" th:src="${attachment.preview} ?: ${attachment.src}" th:alt="${attachment.description} ?: ''"
                 th:title="${attachment.description}">
        </a>
        <video th:if="${attachment.kind == 'video'}" controls preload="none" th:src="${attachment.src}"
               th:poster="${attachment.preview}" th:title="${attachment.description}"></video>
        <audio th:if="${attachment.kind == 'audio'}" controls preload="none" th:src="${attachment.src}"
               th:title="${attachment.description}"></audio>
        <a th:if="${attachment.kind == 'link'}" th:href="${attachment.href}" rel="nofollow noopener noreferrer"
           th:text="${attachment.description} ?: 'Attachment'"></a>
    </th:block>
</div>
<div class="status-poll" th:fragment="poll(poll)" th:if="${poll}">
    <ul>
        <li th:each="option : ${poll.options}">
            <span th:text="${option.title}"></span>
            <span class="status-poll-percent" th:if="${option.percent != null}" th:text="|${option.percent}%|"></span>
        </li>
    </ul>
    <p class="status-poll-meta">
        <span th:if="${poll.votes != null}" th:text="${poll.votes == 1} ? '1 vote' : |${poll.votes} votes|"></span>
        <span th:if="${poll.closes != null}" th:text="${poll.ended} ? |Closed ${poll.closes}| : |Closes ${poll.closes}|"></span>
    </p>
</div>
</html>
