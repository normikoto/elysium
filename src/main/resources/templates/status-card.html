<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<article class="status" th:fragment="card(view)" th:lang="${view.status.language}">
    <p class="status-meta">
        <a th:href="@{/users/{username}(username=${view.username})}" th:text="|@${view.username}|"></a>
        <a th:href="@{${view.path}}"><time th:datetime="${view.timestamp}" th:text="${view.publishedAt}"></time></a>
    </p>
    <details th:if="${view.status.sensitive}">
        <summary th:text="${#strings.isEmpty(view.status.spoilerText)} ? 'Sensitive content' : ${view.status.spoilerText}"></summary>
        <div class="status-content" th:utext="${view.status.content}"></div>
    </details>
    <div class="status-content" th:unless="${view.status.sensitive}" th:utext="${view.status.content}"></div>
</article>
</html>
