# Loaded in addition to src/main/resources/application.properties.
elysium.instance.base-url=http://localhost:8080
# Test classes share contexts and all come from the same address, so they'd use up each other's attempts.
# RateLimitIntegrationTests turns this back on.
elysium.rate-limit.enabled=false
# Test classes share contexts, and most sign with a local actor's key, so they all count against one server's limit.
# InboxLimitIntegrationTests sets its own.
elysium.federation.inbox-limits.activities-per-minute=1000000
elysium.federation.inbox-limits.data-per-hour=100GB
# Somewhere a clean build removes, rather than the checkout.
elysium.media.directory=build/test-media
