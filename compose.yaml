# Production. Build the image with ./gradlew bootBuildImage, copy .env.example to .env and edit it, then run
# docker compose up -d. For local development, see compose.dev.yaml instead.
name: elysium-prod

services:
  app:
    image: 'elysium:latest'
    # This image only exists locally, so don't let a missing one pull something else with the same name from Docker Hub.
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/${POSTGRES_DB:-elysium}'
      SPRING_DATASOURCE_USERNAME: '${POSTGRES_USER:-elysium}'
      SPRING_DATASOURCE_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}'
      ELYSIUM_INSTANCE_BASE_URL: '${ELYSIUM_INSTANCE_BASE_URL:?set ELYSIUM_INSTANCE_BASE_URL in .env}'
      # Only passed on if it's set in .env. Otherwise the default built into the JAR applies.
      ELYSIUM_REGISTRATION_MODE:
      SPRING_MAIL_HOST:
      SPRING_MAIL_PORT:
      SPRING_MAIL_USERNAME:
      SPRING_MAIL_PASSWORD:
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:
      ELYSIUM_MAIL_FROM:
      ELYSIUM_RATELIMIT_ENABLED:
      ELYSIUM_PROFILES_MAXFIELDS:
      ELYSIUM_PROFILES_MAXIMAGESIZE:
      ELYSIUM_ATTACHMENTS_MAXIMAGESIZE:
      ELYSIUM_ATTACHMENTS_MAXVIDEOSIZE:
      ELYSIUM_ATTACHMENTS_MAXAUDIOSIZE:
      ELYSIUM_ATTACHMENTS_MAXUNATTACHEDUPLOADS:
      ELYSIUM_ATTACHMENTS_UNATTACHEDRETENTION:
      ELYSIUM_ATTACHMENTS_REDRAFTRETENTION:
      # In the media-data volume below.
      ELYSIUM_MEDIA_DIRECTORY: /home/cnb/media
      SERVER_SERVLET_SESSION_TIMEOUT:
      ELYSIUM_FEDERATION_INBOXLIMITS_ACTIVITIESPERMINUTE:
      ELYSIUM_FEDERATION_INBOXLIMITS_DATAPERHOUR:
      ELYSIUM_FEDERATION_INBOXLIMITS_EXEMPTDOMAINS:
      # This should not normally be set. See .env.example.
      ELYSIUM_FEDERATION_ALLOWED_PRIVATE_NETWORKS:
      # Experimental. See .env.example.
      DBSCHEDULER_POLLINGSTRATEGY:
      DBSCHEDULER_POLLINGSTRATEGYUPPERLIMITFRACTIONOFTHREADS:
      # The server trusts forwarded headers, which is why the port below is only published on the loopback interface.
      # Keep it that way, with a reverse proxy on this host handling HTTPS, unless you also remove this setting. The proxy
      # must add the client's address to X-Forwarded-For, or clients can get around the rate limits by making up their
      # addresses, and must limit requests to the inboxes. nginx needs configuring to do this: see docs/configuration.md.
      SERVER_FORWARD_HEADERS_STRATEGY: native
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      # Mounted over the home directory of the user the server runs as, because a new volume takes its owner from what
      # it's mounted over, and the server can only write to a directory it owns.
      - 'media-data:/home/cnb'

  postgres:
    image: 'postgres:18-alpine'
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-elysium}'
      POSTGRES_USER: '${POSTGRES_USER:-elysium}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}'
    healthcheck:
      # Over TCP, because the image's temporary server during first-time setup only answers on the Unix socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # PostgreSQL 18 images keep their data in a versioned directory under this path, not in its data subdirectory.
      - 'postgres-data:/var/lib/postgresql'

volumes:
  postgres-data:
  media-data:
