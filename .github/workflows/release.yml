# Builds a published release's JAR and container images, and attaches them to the release.
name: Release

on:
  release:
    types: [published]
  # For a release whose run failed, or that was published before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.2.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # The version is set in the release pull request, before tagging, and NodeInfo reports it. Building a tag whose
      # version doesn't match would publish artifacts under the wrong version.
      - name: Check that the tag matches the version in build.gradle.kts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::build.gradle.kts has version $version, which doesn't match the tag $TAG"
            exit 1
          fi

  test:
    needs: check-version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  jar:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew bootJar
      - run: sha256sum elysium.jar > elysium.jar.sha256
        working-directory: build/libs
      # The config files are attached too, so the installation steps can download a release's files without a checkout.
      # --clobber replaces what an earlier run of the same release uploaded.
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$TAG" --clobber
          build/libs/elysium.jar build/libs/elysium.jar.sha256
          compose.yaml .env.example elysium.service application.properties.example

  image:
    needs: test
    strategy:
      matrix:
        include:
          # Each architecture builds on its own runner, because building for another one runs under emulation, which is many times slower.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./gradlew bootBuildImage --imageName="$IMAGE:${TAG#v}-$ARCH"
          docker push "$IMAGE:${TAG#v}-$ARCH"

  manifest:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A prerelease doesn't take latest, which compose.yaml runs.
      - name: Tag the images for both architectures as one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          tags=(--tag "$IMAGE:$version")
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
