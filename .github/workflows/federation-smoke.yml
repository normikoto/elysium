# The job that federation.yml runs for each server.
name: Federation smoke test

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      use-latest-images:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOSOCIAL_IMAGE: ${{ inputs.use-latest-images && 'docker.io/superseriousbusiness/gotosocial:latest' || '' }}
      MASTODON_IMAGE: ${{ inputs.use-latest-images && 'ghcr.io/mastodon/mastodon:latest' || '' }}
      COMPOSE_FILE: compose.federation.yaml
      COMPOSE_PROFILES: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew bootBuildImage
      - run: federation/smoke.sh ${{ inputs.target }}
      - if: failure()
        run: docker compose logs --no-color > federation-lab.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: federation-lab-${{ inputs.target }}${{ inputs.use-latest-images && '-latest' || '' }}
          path: federation-lab.log
      - if: always()
        run: docker compose down -v --remove-orphans
