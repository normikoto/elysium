# Local development only. ./gradlew bootRun starts this through spring.docker.compose.file in application-dev.properties.
# The name keeps it from sharing a project, and so a postgres container, with compose.yaml in this directory.
name: elysium-dev

services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1::5432'

  # Catches the email the server sends, such as sign-up confirmation links, and shows it at http://localhost:8025. Spring
  # Boot can't find this one by itself, so its ports are fixed, to match application-dev.properties.
  mailpit:
    image: 'axllent/mailpit:v1.27'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
