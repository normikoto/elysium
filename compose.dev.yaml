# Local development only. ./gradlew bootRun starts this through spring.docker.compose.file in application-dev.properties.
# The name keeps it from sharing a project, and so a postgres container, with compose.yaml in this directory.
name: elysium-dev

services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1::5432'
